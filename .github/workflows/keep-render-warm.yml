# Render's free plan sleeps after 15 idle minutes; this keeps the review deployment responsive.
# Remove after the interview to return the free instance hours to the workspace.
name: Keep Render API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://secure-notes-api-qcd2.onrender.com/api/health
