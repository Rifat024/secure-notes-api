# Render Blueprint: runs the API as a long-running Fastify server (src/main.ts).
services:
  - type: web
    name: secure-notes-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: log
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://secure-notes-web.vercel.app
      - key: BCRYPT_ROUNDS
        value: "10"
      # Cloudflare in front of Render sets this and rejects client-supplied values;
      # X-Forwarded-For is not safe here because Render keeps the caller's first entry.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
